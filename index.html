<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(
            circle at 10% 15%,
            rgba(255, 255, 255, 0.22),
            transparent 25%
          ),
          radial-gradient(
            circle at 90% 80%,
            rgba(255, 255, 255, 0.18),
            transparent 25%
          ),
          linear-gradient(135deg, #312e81, #6366f1, #a855f7);
        background-attachment: fixed;
      }

      .page-container {
        min-height: 100vh;
        padding: 40px 15px;
      }

      .register-card {
        width: 100%;
        max-width: 850px;
        padding: 42px;
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 25px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 25px 70px rgba(24, 18, 70, 0.28);
        animation: appear 0.7s ease;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo-box {
        width: 65px;
        height: 65px;
        margin: 0 auto 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        background: linear-gradient(135deg, #4f46e5, #a855f7);
        color: white;
        font-size: 30px;
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
      }

      .heading {
        color: #29245e;
        font-weight: 800;
        letter-spacing: -0.7px;
      }

      .subtitle {
        color: #77758c;
        font-size: 14px;
      }

      .form-label {
        color: #353251;
        font-size: 14px;
        margin-bottom: 7px;
      }

      .form-control {
        min-height: 48px;
        padding: 12px 14px;
        border: 1px solid #e0deee;
        border-radius: 11px;
        background-color: #fafaff;
        font-size: 14px;
        transition: all 0.25s ease;
      }

      .form-control::placeholder {
        color: #aaa8bc;
      }

      .form-control:focus {
        border-color: #8174f5;
        background-color: #fff;
        box-shadow: 0 0 0 4px rgba(129, 116, 245, 0.13);
      }

      .form-check-input {
        cursor: pointer;
      }

      .form-check-input:checked {
        background-color: #6555e8;
        border-color: #6555e8;
      }

      .form-check-input:focus {
        border-color: #8174f5;
        box-shadow: 0 0 0 3px rgba(129, 116, 245, 0.15);
      }

      .form-check-label {
        color: #514e6b;
        font-size: 14px;
        cursor: pointer;
      }

      small.text-danger {
        display: block;
        font-size: 12px;
        margin-top: 5px;
        line-height: 1.5;
      }

      .btn-register {
        min-height: 48px;
        border: none;
        border-radius: 11px;
        background: linear-gradient(100deg, #4f46e5, #9333ea);
        color: white;
        font-weight: 600;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .btn-register:hover {
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(99, 65, 220, 0.3);
      }

      .btn-reset {
        min-height: 48px;
        border: 1px solid #dedbef;
        border-radius: 11px;
        color: #5b5680;
        background: #f7f6ff;
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .btn-reset:hover {
        color: #4f46e5;
        background: #eeecff;
        border-color: #b9b2fa;
      }

      .form-divider {
        height: 1px;
        margin: 25px 0;
        background: linear-gradient(
          to right,
          transparent,
          #dedbef,
          transparent
        );
      }

      @media (max-width: 576px) {
        .page-container {
          padding: 20px 12px;
        }

        .register-card {
          padding: 26px 19px;
          border-radius: 20px;
        }

        .heading {
          font-size: 26px;
        }

        .form-actions {
          flex-direction: column;
        }

        .form-actions .btn {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div
      class="container page-container d-flex justify-content-center align-items-center"
    >
      <div class="register-card">
        <div class="text-center mb-4">
          <div class="logo-box">✦</div>
          <h2 class="heading mb-2">Create Account</h2>
          <p class="subtitle mb-0">
            Join us today! Enter your details to get started.
          </p>
        </div>

        <div class="form-divider"></div>

        <form action="" id="form" novalidate>
          <div class="row g-4">
            <div class="col-md-6">
              <label for="name" class="form-label fw-semibold">Full Name</label>
              <input
                type="text"
                name="name"
                id="name"
                class="form-control"
                placeholder="e.g. Srimathi K"
              />
              <small class="text-danger" id="one"></small>
            </div>

            <div class="col-md-6">
              <label for="email" class="form-label fw-semibold"
                >Email Address</label
              >
              <input
                type="email"
                name="email"
                id="email"
                class="form-control"
                placeholder="you@example.com"
                autocomplete="off"
              />
              <small class="text-danger" id="two"></small>
            </div>

            <div class="col-md-6">
              <label for="password" class="form-label fw-semibold"
                >Password</label
              >
              <input
                type="password"
                name="password"
                id="password"
                class="form-control"
                placeholder="Create a password"
              />
              <small class="text-danger" id="three"></small>
            </div>

            <div class="col-md-6">
              <label for="confirm" class="form-label fw-semibold"
                >Confirm Password</label
              >
              <input
                type="password"
                name="confirm password"
                id="confirm"
                class="form-control"
                placeholder="Re-enter your password"
              />
              <small class="text-danger" id="four"></small>
            </div>

            <div class="col-md-6">
              <label for="phone" class="form-label fw-semibold"
                >Phone Number</label
              >
              <input
                type="tel"
                name="phone number"
                id="phone"
                class="form-control"
                placeholder="10-digit mobile number"
              />
              <small class="text-danger" id="five"></small>
            </div>

            <div class="col-md-6">
              <label for="dob" class="form-label fw-semibold"
                >Date of Birth</label
              >
              <input type="date" name="dob" id="dob" class="form-control" />
              <small class="text-danger" id="six"></small>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold d-block">Gender</label>

              <div class="d-flex flex-wrap gap-4 mt-2">
                <div class="form-check">
                  <input
                    type="radio"
                    name="gen"
                    id="radio1"
                    class="form-check-input"
                    value="Male"
                  />
                  <label for="radio1" class="form-check-label">Male</label>
                </div>

                <div class="form-check">
                  <input
                    type="radio"
                    name="gen"
                    id="radio"
                    class="form-check-input"
                    value="Female"
                  />
                  <label for="radio" class="form-check-label">Female</label>
                </div>
              </div>

              <small class="text-danger" id="sev"></small>
            </div>

            <div class="col-md-6 d-flex align-items-center">
              <div>
                <div class="form-check">
                  <input
                    type="checkbox"
                    name="agree"
                    id="agree"
                    class="form-check-input"
                  />
                  <label for="agree" class="form-check-label">
                    I agree to Terms &amp; Conditions
                  </label>
                </div>
                <small class="text-danger" id="eig"></small>
              </div>
            </div>
          </div>

          <div class="form-divider"></div>

          <div class="d-flex justify-content-center gap-3 form-actions">
            <input
              type="submit"
              value="Create Account"
              class="btn btn-register px-5"
            />
            <input type="reset" value="Reset Form" class="btn btn-reset px-5" />
          </div>

          <p class="text-center subtitle mt-4 mb-0">
            Please make sure all details are correct.
          </p>
        </form>
      </div>
    </div>

    <script>
      let isvalid = true;
      let form = document.getElementById("form");
      let name = document.getElementById("name");
      let n = /^[A-Za-z][A-Za-z0-9_]{5,15}$/;
      let email = document.getElementById("email");
      let e = /^[A-Za-z0-9%+-._]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
      let password = document.getElementById("password");
      let p = /^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[@#$%^&*()!]).{8}$/;
      let confirmm = document.getElementById("confirm");
      let phone = document.getElementById("phone");
      let ph = /^(\+91-)?[6-9]\d{9}$/;
      let dob = document.getElementById("dob");
      let d = /^\d{4}-(0[0-9]|1[0-2])-(0[0-9]|[12][0-9]|3[0-1])$/;
      let radio1 = document.getElementById("radio1");
      let radio = document.getElementById("radio");
      let agree = document.getElementById("agree");
      let one = document.getElementById("one");
      let two = document.getElementById("two");
      let three = document.getElementById("three");
      let four = document.getElementById("four");
      let five = document.getElementById("five");
      let six = document.getElementById("six");
      let sev = document.getElementById("sev");
      let eig = document.getElementById("eig");

      function vname() {
        if (name.value.trim() === "") {
          one.textContent = "Name is required";
          isvalid = false;
        } else if (n.test(name.value.trim())) {
          one.textContent = "";
        } else {
          isvalid = false;
          one.textContent =
            "Format wrong E.g:Srimathi_K r Sri_123 [Strats with letter and include number,_]";
        }
      }
      function vemail() {
        if (email.value.trim() === "") {
          isvalid = false;
          two.textContent = "Email is required";
        } else if (e.test(email.value.trim())) {
          two.textContent = "";
        } else {
          isvalid = false;
          two.textContent = "Format wrong eg:sri123@gmail.com";
        }
      }
      function vpass() {
        if (password.value.trim() === "") {
          isvalid = false;
          three.textContent = "password is required";
        } else if (p.test(password.value.trim())) {
          three.textContent = "";
        } else {
          isvalid = false;
          three.textContent =
            "Password format is wrong 1 uppercase,lowercase,digit,special charcters,min 8 length eg:Sri@123";
        }
      }

      function vconfirm() {
        if (confirmm.value.trim() === "") {
          isvalid = false;
          four.textContent = "confirm password is required";
        } else if (password.value.trim() === confirmm.value.trim()) {
          four.textContent = "";
        } else {
          isvalid = false;
          four.textContent = "Password Mismatch Check your both password";
        }
      }
      function vphone() {
        if (phone.value.trim() === "") {
          isvalid = false;
          five.textContent = "phone is required";
        } else if (ph.test(phone.value.trim())) {
          five.textContent = "";
        } else {
          isvalid = false;
          five.textContent = "Format wrong eg:+91-1234567890 or 1234567890";
        }
      }

      function vdob() {
        if (dob.value.trim() === "") {
          isvalid = false;
          six.textContent = "Dob is required";
        } else if (d.test(dob.value.trim())) {
          six.textContent = "";
        } else {
          isvalid = false;
          six.textContent = "Format wrong eg:2005-04-30";
        }
      }
      function vr1() {
        if (!radio1.checked && !radio.checked) {
          isvalid = false;
          sev.textContent = "Please select your gender";
        } else {
          sev.textContent = "";
        }
      }
      function vagree() {
        if (!agree.checked) {
          isvalid = false;
          eig.textContent = "Please agree terms & conditions";
        } else {
          eig.textContent = "";
        }
      }

      name.addEventListener("input", vname);
      email.addEventListener("input", vemail);
      password.addEventListener("input", vpass);
      confirmm.addEventListener("input", vconfirm);
      phone.addEventListener("input", vphone);
      dob.addEventListener("input", vdob);
      radio1.addEventListener("input", vr1);
      radio.addEventListener("input", vr1);
      agree.addEventListener("input", vagree);

      name.addEventListener("blur", vname);
      email.addEventListener("blur", vemail);
      password.addEventListener("blur", vpass);
      confirmm.addEventListener("blur", vconfirm);
      phone.addEventListener("blur", vphone);
      dob.addEventListener("blur", vdob);
      radio1.addEventListener("blur", vr1);
      radio.addEventListener("blur", vr1);
      agree.addEventListener("blur", vagree);

      function validate() {
        isvalid = true;
        vname();
        vemail();
        vpass();
        vconfirm();
        vphone();
        vdob();
        vr1();
        vagree();
        if (isvalid) {
          alert("Registration Succefull ...!!!");
        }
        form.reset();
      }
      form.addEventListener("submit", (ev) => {
        ev.preventDefault();
        validate();
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
